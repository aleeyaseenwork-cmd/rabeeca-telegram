<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue - {{ title }}</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  (function(){ var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); })();
</script>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div class="breadcrumb">Bot <span>/</span> Revenue</div>
      <div class="header-row">
        <div>
          <h1>Revenue</h1>
          <p class="subtitle">Every successful payment in the selected date range</p>
        </div>
        <div class="header-actions">
          <a href="/" class="btn-outline"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to dashboard</a>
          <a href="/logout" class="btn-outline"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Log out</a>
        </div>
      </div>
    </header>

    <div class="range-card">
      <div class="range-title">Date range</div>
      <div class="range-controls">
        <input type="date" id="rangeStart">
        <span class="range-sep">to</span>
        <input type="date" id="rangeEnd">
        <button class="btn-outline" id="rangeBtn" type="button">Calculate</button>
        <button class="btn-outline range-preset" data-preset="this-month" type="button">This month</button>
        <button class="btn-outline range-preset" data-preset="last-month" type="button">Last month</button>
        <button class="btn-outline range-preset" data-preset="last-30" type="button">Last 30 days</button>
      </div>
      <div class="range-result revenue-total" id="rangeResult"></div>
    </div>

    <div class="table-outer">
      <div class="table-wrap">
        <table class="revenue-table">
          <thead>
            <tr>
              <th>Date (UTC)</th>
              <th>Telegram ID</th>
              <th>Username</th>
              <th>Plan</th>
              <th class="num">Amount</th>
              <th>Currency</th>
              <th>Provider</th>
            </tr>
          </thead>
          <tbody id="paymentsBody">
            <tr><td colspan="7" style="text-align:center;color:var(--text-muted)">Pick a date range</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }
  const fmtLocalDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  async function loadRevenue() {
    const start = document.getElementById("rangeStart").value;
    const end = document.getElementById("rangeEnd").value;
    const out = document.getElementById("rangeResult");
    const body = document.getElementById("paymentsBody");
    if (!start || !end) { out.textContent = "Pick a start and end date."; return; }

    const res = await fetch(`/api/stats/revenue-range?start=${start}&end=${end}`);
    if (res.status === 401) { window.location.href = "/login"; return; }
    const data = await res.json();
    if (!res.ok) { out.textContent = data.error || "Could not load revenue."; return; }

    const sym = data.currency_symbol || "$";
    out.innerHTML = `<strong>${escapeHtml(sym)}${Number(data.revenue).toFixed(2)}</strong>` +
      `<span class="range-meta">total from ${data.count} payment${data.count === 1 ? "" : "s"}, ${escapeHtml(start)} to ${escapeHtml(end)}</span>`;

    const payments = data.payments || [];
    if (!payments.length) {
      body.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--text-muted)">No successful payments in this range</td></tr>`;
      return;
    }
    body.innerHTML = payments.map(p => `
      <tr>
        <td class="mono">${escapeHtml((p.created_at || "").replace("T", " ").slice(0, 16))}</td>
        <td class="mono">${escapeHtml(p.telegram_user_id)}</td>
        <td>${p.telegram_username ? "@" + escapeHtml(p.telegram_username) : "-"}</td>
        <td>${escapeHtml(p.plan || "-")}</td>
        <td class="num">${Number(p.amount || 0).toFixed(2)}</td>
        <td>${escapeHtml(p.currency || "-")}</td>
        <td>${escapeHtml(p.provider || "-")}</td>
      </tr>`).join("");
  }

  function setRange(preset) {
    const now = new Date();
    let start, end = now;
    if (preset === "this-month") start = new Date(now.getFullYear(), now.getMonth(), 1);
    if (preset === "last-month") {
      start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      end = new Date(now.getFullYear(), now.getMonth(), 0);
    }
    if (preset === "last-30") { start = new Date(now); start.setDate(start.getDate() - 30); }
    document.getElementById("rangeStart").value = fmtLocalDate(start);
    document.getElementById("rangeEnd").value = fmtLocalDate(end);
    loadRevenue();
  }

  document.getElementById("rangeBtn").addEventListener("click", loadRevenue);
  document.querySelectorAll(".range-preset").forEach(btn => {
    btn.addEventListener("click", () => setRange(btn.dataset.preset));
  });

  setRange("this-month");   // open on the current month
</script>
</body>
</html>
